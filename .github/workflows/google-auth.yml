name: Google認証のWorkers互換性

on:
  pull_request:
    paths:
      - 'src/lib/auth/**'
      - 'tests/unit/auth/**'
      - 'tests/helpers/google-oidc.ts'
      - 'scripts/test-google-oidc-worker.mjs'
      - 'scripts/fixtures/google-oidc-worker.ts'
      - 'package*.json'
      - '.github/workflows/google-auth.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/auth/**'
      - 'tests/unit/auth/**'
      - 'tests/helpers/google-oidc.ts'
      - 'scripts/test-google-oidc-worker.mjs'
      - 'scripts/fixtures/google-oidc-worker.ts'
      - 'package*.json'
      - '.github/workflows/google-auth.yml'

permissions:
  contents: read

jobs:
  google-oidc-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:google-oidc:worker
