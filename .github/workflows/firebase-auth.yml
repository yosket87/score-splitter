name: Firebase認証の検証

on:
  pull_request:
    paths:
      - 'src/**'
      - 'cloudflare/worker/**'
      - 'scripts/*firebase*'
      - 'scripts/fixtures/firebase-token-worker.ts'
      - 'scripts/backup-*.mjs'
      - 'tests/**'
      - 'package*.json'
      - 'next.config.ts'
      - 'wrangler.jsonc'
      - '.github/workflows/firebase-auth.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  firebase-token-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:firebase-token:worker
  firebase-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:d1:firebase
  firebase-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/firebase-auth.spec.ts
        env:
          FIREBASE_AUTH_MOCK: 'true'
