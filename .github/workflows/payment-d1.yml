name: Household and payment D1 consistency

on:
  pull_request:
    paths:
      - 'cloudflare/worker/migrations/**'
      - 'cloudflare/worker/src/**'
      - 'src/lib/utils/calculation.ts'
      - 'src/lib/utils/payment-status.ts'
      - 'src/lib/validations/payment-status.ts'
      - 'src/types/payment-status.ts'
      - 'scripts/test-*-d1.mjs'
      - 'scripts/test-household-migrations.mjs'
      - 'scripts/household-d1-*.mjs'
      - 'scripts/backup-*.mjs'
      - 'tests/fixtures/household-migration.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/payment-d1.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/worker/**'
      - 'src/lib/utils/**'
      - 'src/lib/validations/payment-status.ts'
      - 'src/types/payment-status.ts'
      - 'scripts/test-*-d1.mjs'
      - 'scripts/test-household-migrations.mjs'
      - 'scripts/household-d1-*.mjs'
      - 'scripts/backup-*.mjs'
      - 'tests/fixtures/household-migration.sql'
      - 'package*.json'
      - '.github/workflows/payment-d1.yml'
  schedule:
    - cron: '20 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-d1:
    name: D1 ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [payment, records, ai-payment, household-migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 隔離ローカルD1で整合性を検証
        run: npm run test:d1:${{ matrix.suite }}
