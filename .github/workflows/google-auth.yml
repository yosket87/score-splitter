name: Google認証のWorkers互換性

on:
  pull_request:
    paths:
      - 'src/lib/auth/**'
      - 'src/lib/mock-mode.ts'
      - 'src/lib/api/**'
      - 'cloudflare/worker/src/**'
      - 'cloudflare/worker/migrations/**'
      - 'src/app/api/auth/**'
      - 'src/app/api/mock/**'
      - 'src/mocks/**'
      - 'src/instrumentation.ts'
      - 'next.config.ts'
      - 'wrangler.jsonc'
      - 'scripts/test-google-auth-production.mjs'
      - 'tests/unit/auth/**'
      - 'tests/unit/lib/auth/**'
      - 'tests/integration/api/google-*.test.ts'
      - 'tests/helpers/google-oidc.ts'
      - 'scripts/test-google-oidc-worker.mjs'
      - 'scripts/fixtures/google-oidc-worker.ts'
      - 'package*.json'
      - '.github/workflows/google-auth.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/auth/**'
      - 'src/lib/mock-mode.ts'
      - 'src/lib/api/**'
      - 'cloudflare/worker/src/**'
      - 'cloudflare/worker/migrations/**'
      - 'src/app/api/auth/**'
      - 'src/app/api/mock/**'
      - 'src/mocks/**'
      - 'src/instrumentation.ts'
      - 'next.config.ts'
      - 'wrangler.jsonc'
      - 'scripts/test-google-auth-production.mjs'
      - 'tests/unit/auth/**'
      - 'tests/unit/lib/auth/**'
      - 'tests/integration/api/google-*.test.ts'
      - 'tests/helpers/google-oidc.ts'
      - 'scripts/test-google-oidc-worker.mjs'
      - 'scripts/fixtures/google-oidc-worker.ts'
      - 'package*.json'
      - '.github/workflows/google-auth.yml'

permissions:
  contents: read

jobs:
  google-oidc-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:google-oidc:worker

  google-production-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: production成果物を作成
        run: npx opennextjs-cloudflare build --env dev
      - name: 有効設定からのmock封鎖とPreview拒否を隔離workerdで検証
        run: npm run test:google-auth:production
